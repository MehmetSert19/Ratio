/* ---------- Türkçe metin eşleştirme (anahtar kelimeler) ---------- */
function normTr(s) {
  return String(s == null ? '' : s).toLocaleLowerCase('tr').replace(/[âàá]/g, 'a').replace(/[îíì]/g, 'i').replace(/[ûúù]/g, 'u')
    .replace(/[’'`´]/g, '').replace(/[^0-9a-zçğıöşü]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function kwHits(kws, text) {
  const t = ' ' + normTr(text) + ' ';
  return arr(kws).map(k => {
    const alts = String(k).split('|').map(normTr).filter(Boolean);
    return { ad: String(k).split('|')[0], hit: alts.some(a => t.includes(a.length <= 4 && /^\d+$/.test(a) ? ' ' + a : a)) };
  });
}
function kpCovered(kp, text) {
  const h = kwHits(kp.kw, text), n = h.length, got = h.filter(x => x.hit).length;
  return n ? got >= (n <= 2 ? n : n - 1) : false;
}

/* ---------- Okuma şemaları ---------- */
let SEMA_N = 0;
function agacView(b) {
  const leaf = a => `<li><div class="ag-n"><b>${fmt(a.ad)}</b>${a.x ? `<span>${fmt(a.x)}</span>` : ''}</div>${a.alt ? `<ul>${a.alt.map(leaf).join('')}</ul>` : ''}</li>`;
  return `<figure class="wide fig">${b.h ? `<figcaption>${esc(b.h)}</figcaption>` : ''}<div class="agac"><div class="ag-kok">${fmt(b.kok)}</div><ul class="ag-dal">${b.dallar.map(leaf).join('')}</ul></div></figure>`;
}
function akisView(b) {
  return `<figure class="wide fig">${b.h ? `<figcaption>${esc(b.h)}</figcaption>` : ''}<ol class="akis">${b.items.map((i, n) => `<li><span class="ak-n tnum">${n + 1}</span><div><b>${fmt(i.ad)}</b><p>${fmt(i.x)}</p></div></li>`).join('')}</ol></figure>`;
}
function semaView(b) {
  const id = 'ar' + (++SEMA_N), W = b.w || 360, H = b.y || 260, N = {};
  b.d.forEach(n => { N[n.id] = n; });
  const cx = n => n.x + n.w / 2, cy = n => n.y + n.h / 2;
  const clip = (n, tx, ty) => {
    const x0 = cx(n), y0 = cy(n), dx = tx - x0, dy = ty - y0;
    const sx = dx ? (n.w / 2 + 4) / Math.abs(dx) : Infinity, sy = dy ? (n.h / 2 + 4) / Math.abs(dy) : Infinity;
    const s = Math.min(sx, sy);
    return [x0 + dx * s, y0 + dy * s];
  };
  const r1 = x => Math.round(x * 10) / 10;
  const edges = b.o.map(e => {
    const A = N[e.a], B = N[e.b], ax = cx(A), ay = cy(A), bx = cx(B), by = cy(B);
    const len = Math.hypot(bx - ax, by - ay) || 1, nx = -(by - ay) / len, ny = (bx - ax) / len, k = e.egri || 0;
    const qx = (ax + bx) / 2 + nx * k, qy = (ay + by) / 2 + ny * k;
    const p1 = clip(A, k ? qx : bx, k ? qy : by), p2 = clip(B, k ? qx : ax, k ? qy : ay);
    const d = k ? `M${r1(p1[0])},${r1(p1[1])} Q${r1(qx)},${r1(qy)} ${r1(p2[0])},${r1(p2[1])}` : `M${r1(p1[0])},${r1(p1[1])} L${r1(p2[0])},${r1(p2[1])}`;
    const lx = e.lx != null ? e.lx : r1(k ? (p1[0] + 2 * qx + p2[0]) / 4 : (p1[0] + p2[0]) / 2);
    const ly = e.ly != null ? e.ly : r1(k ? (p1[1] + 2 * qy + p2[1]) / 4 : (p1[1] + p2[1]) / 2);
    const lines = String(e.ad || '').split('\n');
    const tsp = lines.map((t, j) => `<tspan x="${lx}" dy="${j ? 13 : r1(4 - (lines.length - 1) * 6.5)}">${esc(t)}</tspan>`).join('');
    const mk = e.yon === 'yok' ? '' : ` marker-end="url(#${id}${e.k === 'x' ? 'x' : ''})"`;
    return `<path class="se${e.k === 'x' ? ' x' : ''}" d="${d}"${mk}/><text class="sl${e.k === 'x' ? ' x' : ''}" text-anchor="${e.anchor || 'middle'}" x="${lx}" y="${ly}">${tsp}</text>`;
  }).join('');
  const nodes = b.d.map(n => {
    const t = n.alt ? `<text class="sn-t" x="${cx(n)}" y="${cy(n) - 3}">${esc(n.ad)}</text><text class="sn-a" x="${cx(n)}" y="${cy(n) + 13}">${esc(n.alt)}</text>` : `<text class="sn-t" x="${cx(n)}" y="${cy(n) + 4.5}">${esc(n.ad)}</text>`;
    return `<rect class="sn ${n.k || ''}" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="9"/>${t}`;
  }).join('');
  const mk = (sfx, cls) => `<marker id="${id}${sfx}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="${cls}" d="M0,0 L10,5 L0,10 z"/></marker>`;
  return `<figure class="wide fig">${b.h ? `<figcaption>${esc(b.h)}</figcaption>` : ''}<div class="sema"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(b.alt || b.h || 'Şema')}"><defs>${mk('', 'mk')}${mk('x', 'mk x')}</defs>${edges}${nodes}</svg></div>${b.alt ? `<p class="fig-alt">${esc(b.alt)}</p>` : ''}</figure>`;
}
const yoklaView = b => `<details class="yokla"><summary><span class="yk-l">Kendini yokla</span><span class="yk-q">${fmt(b.q)}</span></summary><div class="yk-a">${fmt(b.a)}</div></details>`;
function cellView(c, i) {
  const s = String(c), cls = s.startsWith('✓') ? ' class="c-ok"' : s.startsWith('✗') ? ' class="c-no"' : '';
  return i === 0 ? `<td><strong>${fmt(s)}</strong></td>` : `<td${cls}>${fmt(s)}</td>`;

  if (son) { const dId = son.slice(0, son.lastIndexOf('-')), kId = son.slice(son.lastIndexOf('-') + 1), d = dersOf(dId), k = konuOf(dId, kId); if (d && k) parts.push(`<div class="card"><p class="eyebrow">Diğer cihazda en son</p><p><a href="#konu-${son}">${esc(d.ad)} · Konu ${esc(k.no)}: ${esc(k.ad)}</a></p></div>`); }

function startSession(early) {

function rateCard(g) {
  const ses = S.ui.ses;
  if (!ses || !ses.cur || !ses.rev) return;
  const id = ses.cur;
  (ses.hist = ses.hist || []).push({ cur: id, queue: ses.queue.slice(), done: ses.done.slice(), again: ses.again, res: JSON.parse(JSON.stringify(ses.res)), rec: S.st.cards[id] ? JSON.parse(JSON.stringify(S.st.cards[id])) : null, err: g === 1 && !ses.res[id] });
  if (ses.hist.length > 20) ses.hist.shift();
  if (S.drafts.kart) setDraft('kart', '');
  const r = ses.res[id] || (ses.res[id] = { seen: 0, streak: 0, first: null, need: 1 });
  const firstTime = r.first === null;
  r.seen++;
  if (firstTime) {
    r.first = g;
    commit(st => { st.cards[id] = fsrsNext(st.cards[id], g, Date.now()); if (g === 1) addErr(st, 'Bilgi eksikliği', 'Kart ' + CARD[id].n); }, { quiet: true });
  }
  if (g === 1) r.need = 2;
  r.streak = g >= 3 ? r.streak + 1 : 0;
  const finished = g >= 3 && r.streak >= r.need;
  if (finished) ses.done.push(id);
  else { if (firstTime) ses.again++; ses.queue.splice(Math.min(ses.queue.length, g === 1 ? 2 : 4), 0, id); }
  ses.cur = ses.queue.shift() || null;
  ses.rev = false;
  if (!ses.cur) commit(st => addLog(st, 'Kart oturumu: ' + ses.total + ' kart, ' + ses.again + ' tanesi tekrar istedi'));
  else render();
}
function checkEx(id) {
  const e = PAKET.ayirt[id];
  let score = 0, wrong = 0;
  if (id === 'e1' || id === 'e3') {
    const map = id === 'e1' ? S.ui.e1 : S.ui.e3;
    const c = e.items.filter(it => map[it.id] === it.a).length;
    score = c / e.items.length; wrong = e.items.length - c;
  } else if (id === 'e2') {
    const correct = e.items.slice().sort((a, b) => a.y - b.y);
    const c = S.ui.e2.filter((x, i) => correct[i] && correct[i].id === x).length;
    score = c / correct.length; wrong = c < correct.length ? 1 : 0;
  }
  S.ui.exChecked[id] = true;
  commit(st => {
    const p = st.ex[id] || { best: 0, n: 0 };
    st.ex[id] = { t: Date.now(), best: Math.max(p.best || 0, score), last: score, n: (p.n || 0) + 1 };
    for (let i = 0; i < Math.min(4, wrong); i++) addErr(st, e.err, 'Ayırt et · ' + e.ad);
    addLog(st, e.ad + ': %' + pct(score));
  });
}
function answerDY(itId, ri) {
  const e = PAKET.ayirt.e4, it = e.items.find(x => x.id === itId), s = S.ui.e4[itId];
  if (!it || !s || s.v == null || !s.c || s.r != null) return;
  s.r = ri;
  const vOk = s.v === it.d, rOk = ri === it.w;
  s.score = vOk ? (rOk ? 1 : 0.5) : 0;
  const allDone = e.items.every(x => S.ui.e4[x.id] && S.ui.e4[x.id].r != null);
  commit(st => {
    addCalib(st, s.c, vOk, it.x, (it.d ? 'Doğru: ' : 'Yanlış: ') + it.why[it.w]);
    if (!vOk) addErr(st, 'Kavram karışıklığı', 'Gerekçeli doğru/yanlış');
    else if (!rOk) addErr(st, 'Eksik gerekçe', 'Gerekçeli doğru/yanlış');
    if (allDone) {
      const sc = avg(e.items.map(x => S.ui.e4[x.id].score)), p = st.ex.e4 || { best: 0, n: 0 };
      st.ex.e4 = { t: Date.now(), best: Math.max(p.best || 0, sc), last: sc, n: (p.n || 0) + 1 };
      addLog(st, 'Gerekçeli doğru/yanlış: %' + pct(sc));

}

/* ================= 8. HESAP, UYGULAMA (PWA) VE YEDEK =================
   Claude içinde: senkron Claude'un db'si ile. Uygulama sürümünde (window.RATIO_PWA): Firebase Auth + Firestore,
   çevrimdışı kalıcılık açık; arayüz aynı syncer'ı kullanır (Firestore uyumlu API). */
const PWA = { on: !!window.RATIO_PWA, fb: null, auth: null, user: null, hata: null, yeni: null, kurulum: null, durum: 'bekliyor' };
const FB_KOD = { 'resource-exhausted': 'quota_exceeded', 'unavailable': 'unavailable', 'invalid-argument': 'invalid_argument' };
function fsSarmal(fs) {
  return {
    collection: p => {
      const c = fs.collection(p);
      return {
        doc: id => {
          const d = c.doc(id);
          return {
            set: v => d.set(v).catch(e => { throw { code: FB_KOD[e && e.code] || (e && e.code) || 'error' }; }),
            onSnapshot: (n, er) => d.onSnapshot({ includeMetadataChanges: true }, n, er)
          };
        }
      };
    }
  };
}
function pwaInit() {
  // service worker ve güncelleme
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const bak = w => { if (!w) return; w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) { PWA.yeni = w; toast('Yeni sürüm hazır. Hesap ekranından yenileyebilirsin.'); renderSoon(); } }); };
      if (reg.waiting && navigator.serviceWorker.controller) { PWA.yeni = reg.waiting; renderSoon(); }
      bak(reg.installing);
      reg.addEventListener('updatefound', () => bak(reg.installing));
      setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
    }).catch(() => {});
    let yenilendi = false; const vardi = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (yenilendi || !vardi) return; yenilendi = true; location.reload(); });
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.kurulum = e; renderSoon(); });
  // Firebase
  const cfg = window.RATIO_FIREBASE;
  if (!cfg || !cfg.apiKey || !window.firebase) { PWA.durum = 'ayarsiz'; showSync(); return; }
  try {
    PWA.fb = firebase.initializeApp(cfg);
    const fs = firebase.firestore();
    fs.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    PWA.auth = firebase.auth();
    PWA.auth.getRedirectResult().catch(e => { PWA.hata = authHata(e); renderSoon(); });
    PWA.auth.onAuthStateChanged(u => {
      PWA.user = u || null; PWA.durum = u ? 'girdi' : 'cikti';
      if (u) { DBX.db = fsSarmal(fs); DBX.uid = u.uid; GS.bind('ratio-genel'); if (DOC_ID) TS.bind(DOC_ID); }
      else { TS.stop(); GS.stop(); DBX.db = null; DBX.uid = null; TS.set('local'); GS.set('local'); }
      renderSoon();
    });
  } catch (e) { PWA.durum = 'hata'; PWA.hata = 'Firebase başlatılamadı: ' + (e && e.message || e); showSync(); }
}
function authHata(e) {
  const c = e && e.code || '';
  return ({
    'auth/invalid-credential': 'E-posta ya da şifre yanlış.', 'auth/wrong-password': 'Şifre yanlış.', 'auth/user-not-found': 'Bu e-postayla hesap yok. “Hesap oluştur”u dene.',
    'auth/email-already-in-use': 'Bu e-postayla hesap zaten var; giriş yap.', 'auth/weak-password': 'Şifre en az 6 karakter olmalı.', 'auth/invalid-email': 'E-posta adresi geçersiz.',
    'auth/popup-blocked': 'Açılır pencere engellendi; tekrar dene ya da e-postayla gir.', 'auth/popup-closed-by-user': 'Giriş penceresi kapatıldı.',
    'auth/network-request-failed': 'İnternet yok. Giriş için bir kez bağlanman gerekir; sonra çevrimdışı çalışır.', 'auth/unauthorized-domain': 'Bu adres Firebase’de yetkili değil (Authentication › Settings › Authorized domains).',
    'auth/operation-not-allowed': 'Bu giriş yöntemi Firebase’de açılmamış (Authentication › Sign-in method).'
  })[c] || ('Giriş olmadı: ' + (e && e.message || c));
}
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
async function googleGiris() {
  PWA.hata = null;
  const p = new firebase.auth.GoogleAuthProvider();
  try { await PWA.auth.signInWithPopup(p); }
  catch (e) {
    if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) { try { await PWA.auth.signInWithRedirect(p); return; } catch (e2) { e = e2; } }
    PWA.hata = authHata(e); render();

}

/* Yedek: bu cihazdaki bütün Ratio kayıtları tek dosyada */
function yedekAl() {
  const data = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('ratio.')) data[k] = JSON.parse(localStorage.getItem(k)); } } catch (e) { /* yok */ }
  if (AKTIF && LS_STATE) data[LS_STATE] = S.st;
  data[LS_GENEL] = GENEL;
  const metin = JSON.stringify({ app: 'ratio', v: 1, t: Date.now(), data }, null, 1);
  const ad = 'ratio-yedek-' + new Date().toISOString().slice(0, 10) + '.json';
  if (!PWA.on && window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(d => {
      if (!d) { toast('Bu görünümde dosya indirilemiyor.'); return; }
      return d.save({ filename: ad, data: metin }).then(() => toast(Object.keys(data).length + ' kayıt dışa aktarıldı.'), e => { if (e && e.code !== 'declined') toast('Dosya kaydedilemedi.'); });
    });
    return;
  }
  const blob = new Blob([metin], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = ad;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast(Object.keys(data).length + ' kayıt dışa aktarıldı.');
}
async function yedekYukle(file) {
  let j;
  try { j = JSON.parse(await file.text()); } catch (e) { toast('Dosya okunamadı.'); return; }
  if (!j || j.app !== 'ratio' || !j.data) { toast('Bu bir Ratio yedeği değil.'); return; }
  let n = 0;
  for (const [k, v] of Object.entries(j.data)) {
    if (!k.startsWith('ratio.')) continue;
    if (k === LS_GENEL) { GENEL = mergeGenel(GENEL, v); GENEL.t = Date.now(); lsSet(LS_GENEL, GENEL); GS.schedule(0); n++; continue; }
    if (/\.v1$/.test(k)) {
      const cur = k === LS_STATE ? S.st : sane(lsGet(k));
      const m = mergeState(cur, v);
      lsSet(k, m); if (k === LS_STATE) { S.st = m; TS.schedule(0); }
      n++; continue;
    }
    if (/\.drafts$/.test(k)) { lsSet(k, Object.assign({}, v, lsGet(k) || {})); n++; continue; }
    if (k === LS_SON) continue;
  }
  toast(n + ' kayıt birleştirildi. Konuları açtıkça hesabına da gönderilir.');
  render();
}
