<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A1C2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ratio">
<meta name="description" content="Ratio: hukuk çalışma sistemi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css">
<script>window.RATIO_PWA = true; window.RATIO_SURUM = '2026.11.09-1524';</script>
<script src="firebase-config.js"></script>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<style>body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}</style>
<title>Ratio</title>
<style>
/* Düzen: kanun metni gibi. Solda madde ve adım numarası, ortada ~65 karakterlik okuma sütunu,
   kaynaklar kenar notu gibi küçük mono etiketlerde. Telefonda tek sütun ve alt sekme çubuğu. */
:root{
  --paper:#EEF0EC; --sheet:#FAFBF8; --sheet-2:#F2F4F0;
  --ink:#141922; --ink-2:#4C5767; --ink-3:#7C8593;
  --rule:#D3D8D1; --rule-2:#E3E7E1;
  --accent:#7A1C2A; --accent-ink:#FFFFFF; --accent-soft:#F1E2E4; --accent-line:#C99CA3;
  --good:#2B6746; --good-soft:#DBECE1;
  --warn:#8F5C0E; --warn-soft:#F3E6CC;
  --bad:#AD341C; --bad-soft:#F6DCD5;
  --focus:#2A5DA6;
  --f-display:"Source Serif 4","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --r-s:7px; --tab-h:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1015; --sheet:#151920; --sheet-2:#1B2029;
    --ink:#E7E9ED; --ink-2:#A6AEBB; --ink-3:#727B8A;
    --rule:#2B323D; --rule-2:#222833;
    --accent:#E58A96; --accent-ink:#22090E; --accent-soft:#3A2027; --accent-line:#7E4650;
    --good:#7DC9A2; --good-soft:#18302A;
    --warn:#E5B76B; --warn-soft:#382C17;
    --bad:#F09380; --bad-soft:#3B221E;
    --focus:#8FB6F2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1015; --sheet:#151920; --sheet-2:#1B2029;
  --ink:#E7E9ED; --ink-2:#A6AEBB; --ink-3:#727B8A;
  --rule:#2B323D; --rule-2:#222833;
  --accent:#E58A96; --accent-ink:#22090E; --accent-soft:#3A2027; --accent-line:#7E4650;
  --good:#7DC9A2; --good-soft:#18302A;
  --warn:#E5B76B; --warn-soft:#382C17;
  --bad:#F09380; --bad-soft:#3B221E;
  --focus:#8FB6F2; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--paper)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.22;text-wrap:balance;margin:0}
p{margin:0}
ul,ol{margin:0}
.vh,.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:13.5px}
.tnum{font-variant-numeric:tabular-nums}

/* Üst çubuk */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;min-height:54px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wordmark{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:23px;text-decoration:none;color:var(--accent);line-height:1}
.course{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.tabs-top{display:none;gap:4px;margin-left:10px}
.tabs-top a{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:14px}
.tabs-top a[aria-current="page"]{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.sync{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;background:none;border:0;padding:6px 0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.sync[data-s="on"] .dot{background:var(--good)}
.sync[data-s="connecting"] .dot,.sync[data-s="slow"] .dot{background:var(--warn)}
.sync[data-s="error"] .dot,.sync[data-s="readonly"] .dot{background:var(--bad)}
@media (max-width:520px){.sync-t{display:none}}

/* Alt sekme çubuğu (telefon) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(3,1fr);background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar a{display:flex;align-items:center;justify-content:center;min-height:var(--tab-h);text-decoration:none;font-weight:500;font-size:14px;color:var(--ink-2);position:relative}
.tabbar a[aria-current="page"]{color:var(--accent)}
.tabbar a[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--accent)}
@media (min-width:900px){.tabbar{display:none}.tabs-top{display:flex}}

/* Sayfa */
.shell{display:block;max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px calc(var(--tab-h) + 44px + env(safe-area-inset-bottom,0px));outline:none}
@media (min-width:900px){.shell{padding-block:34px 72px}}
.col{max-width:760px}
.title{font-size:29px;margin-top:6px}
@media (max-width:520px){.title{font-size:24px}}
.lead{color:var(--ink-2);max-width:64ch;margin-top:8px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font-weight:500;font-size:14.5px;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--accent);padding:0 8px}
.btn.sm{min-height:34px;padding:0 13px;font-size:13.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.03em;padding:2px 8px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.pill.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.pill.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.pill.accent{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}
.src{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.03em;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:1px 6px;white-space:nowrap;background:var(--sheet-2);vertical-align:1px}
.madde{font-family:var(--f-mono);font-size:.86em;color:var(--accent);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--sheet);margin-top:16px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:500;font-size:14px;color:var(--ink-2);min-height:36px}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}
input[type="date"]{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r-s);padding:8px 10px;min-height:40px}
textarea{display:block;width:100%;min-height:210px;resize:vertical;padding:14px 16px;border-radius:var(--r-s);border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-display);font-size:16.5px;line-height:1.55}
select{border:1px solid var(--accent-line);background:var(--sheet);border-radius:6px;padding:3px 6px;font-family:var(--f-ui);font-size:14.5px;max-width:100%}
select.ok{border-color:var(--good);background:var(--good-soft)}
select.bad{border-color:var(--bad);background:var(--bad-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (min-width:900px){.toast{bottom:28px}}
.thinking{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1px dashed var(--rule);border-radius:var(--r-s);color:var(--ink-2);margin-top:12px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Bugün */
.exam{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.plan{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:10px}
.plan li{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px}
.plan .min{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.plan strong{display:block;font-weight:600}
.plan .s{display:block;color:var(--ink-2);font-size:13.5px}
@media (max-width:440px){.plan li{grid-template-columns:44px 1fr}.plan li .btn{grid-column:1/-1}}
.why-plan{color:var(--ink-2);font-size:13.5px;margin-top:10px;max-width:64ch}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:22px}
.stat3>div{border-top:1px solid var(--rule);padding-top:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat3 b{font-family:var(--f-display);font-size:26px;font-weight:600}
.stat3 small{color:var(--ink-2);font-size:12.5px}
@media (max-width:440px){.stat3{grid-template-columns:1fr}}

/* Konu yolu */
.path{list-style:none;padding:0;margin:22px 0 0;position:relative}
.path::before{content:"";position:absolute;left:19px;top:10px;bottom:10px;width:1px;background:var(--rule)}
.node{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:7px 0;position:relative}
.node-no{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;background:var(--paper);border:1px solid var(--rule);color:var(--ink-3);position:relative;z-index:1}
.node.open .node-no{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.node.locked .node-no,.node.unlocked .node-no{border-color:var(--accent-line);color:var(--accent)}
.node-body{padding-top:8px;min-width:0}
.node-card{background:var(--sheet);border:1px solid var(--accent-line);border-radius:var(--r);padding:12px 14px;min-width:0}
.node-t{font-family:var(--f-display);font-size:17px;font-weight:600;text-decoration:none;display:block}
a.node-t:hover{text-decoration:underline;text-underline-offset:3px}
.node.empty .node-t{color:var(--ink-2);font-weight:400}
.node-m{font-size:13px;color:var(--ink-2);margin-top:3px;display:flex;flex-wrap:wrap;gap:2px 12px}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:10px;max-width:300px}
.mini i{height:5px;border-radius:2px;background:var(--rule)}
.mini i.done{background:var(--good)}
.mini i.part{background:var(--warn)}
.sources{margin-top:24px}
.sources ul{padding-left:1.1em;margin-top:8px;color:var(--ink-2);font-size:14px}
.sources li+li{margin-top:4px}

/* Konu sayfası */
.back{font-size:14px;color:var(--accent);text-decoration:none;font-weight:500}
.konu-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end}
.konu-t .eyebrow{margin-top:12px}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.ring{--p:0;width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--rule-2) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--paper)}
.ring b{position:relative;font-family:var(--f-mono);font-size:15px;font-weight:500}
.ring.big{width:96px;height:96px}
.ring.big::before{background:var(--sheet)}
@media (max-width:640px){.konu-t .lead{display:none}}
@media (max-width:520px){.konu-head{grid-template-columns:1fr}.ring-wrap{flex-direction:row;justify-content:flex-start}.ring{width:58px;height:58px}.ring::before{inset:6px}.ring b{font-size:13px}}
.steps{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin-top:20px;scrollbar-width:thin}
.step-btn{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:500;font-size:13.5px;color:var(--ink-2);min-height:38px}
.step-btn .n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;font-family:var(--f-mono);font-size:11.5px;background:var(--sheet-2);border:1px solid var(--rule);color:var(--ink-2)}
.step-btn.done .n{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.step-btn.part .n{border-color:var(--warn);color:var(--warn)}
.step-btn[aria-current="step"]{border-color:var(--accent);color:var(--ink)}
.step-btn[aria-current="step"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step-body{max-width:860px}
.step-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;margin:22px 0 18px}
.step-no{font-family:var(--f-mono);font-size:13px;color:var(--accent);border:1px solid var(--accent-line);border-radius:6px;padding:3px 8px;margin-top:5px}
.step-h h2{font-size:24px}
.step-h p{color:var(--ink-2);margin-top:6px;max-width:64ch}
.step-foot{display:flex;justify-content:space-between;gap:10px;margin-top:28px;max-width:860px;flex-wrap:wrap}

/* Soru, seçenek, geri bildirim */
.qlist{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px}
.q-text{font-family:var(--f-display);font-size:18px;line-height:1.45;margin-top:4px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:10px 14px;border-radius:var(--r-s);border:1px solid var(--rule);background:var(--sheet);min-height:44px;font-size:14.5px}
.opt .l{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.opt:hover:not([disabled]){border-color:var(--ink-3)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.conf{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.choice{padding:6px 13px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet-2);font-size:13.5px;min-height:36px;text-align:left}
.choice:hover:not([disabled]){border-color:var(--ink-3)}
.choice[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice.ok{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.choice.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.choice[disabled]{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:var(--r-s);border:1px solid var(--rule);background:var(--sheet-2);font-size:14.5px;line-height:1.55}
.fb .pill{margin-right:6px}
.done-card{margin-top:14px}

/* Oku */
.sec{border-top:1px solid var(--rule);padding:22px 0}
.sec-h{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:baseline}
.sec-no{font-family:var(--f-mono);color:var(--accent);font-size:14px}
.sec-h h3{font-size:20px}
.sec-srcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sec-body{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.prose{font-family:var(--f-display);font-size:17px;line-height:1.6;max-width:66ch;margin-left:52px}
.wide{margin-left:52px;min-width:0}
@media (max-width:640px){.prose,.wide{margin-left:0}}
.flat .prose,.flat .wide{margin-left:0}
.prose ul,.prose ol{padding-left:1.2em}
.prose li+li{margin-top:6px}
.prose p+p{margin-top:10px}
.prose h4{font-size:17px;margin-top:6px}
.quote{margin:0;font-style:italic;border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r-s);padding:12px 16px}
.quote cite{display:block;font-style:normal;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);margin-top:6px}
.dl{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:8px 16px;margin:0}
.dl dt{font-family:var(--f-ui);font-weight:600;font-size:14.5px;padding-top:2px}
.dl dd{margin:0}
@media (max-width:640px){.dl{grid-template-columns:1fr}.dl dd{margin-bottom:6px}}
.box{border:1px solid var(--rule);border-radius:var(--r-s);padding:12px 16px;background:var(--sheet);font-family:var(--f-ui);font-size:14.5px;line-height:1.55}
.box .bh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;margin-bottom:6px}
.box ul{padding-left:1.1em}
.box li+li{margin-top:4px}
.box[data-k="kontrol"]{background:var(--warn-soft);border-color:var(--warn)}
.box[data-k="sinav"]{border-color:var(--accent-line)}
.box-src{margin-top:8px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r-s);background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-family:var(--f-ui);font-size:14px;line-height:1.5}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--rule-2)}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--sheet-2);font-weight:500;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tl{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px;margin:0;scroll-snap-type:x proximity;list-style:none}
.tl li{flex:0 0 232px;scroll-snap-align:start;border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r-s);padding:12px 14px;font-size:13.5px;line-height:1.5}
.tl .y{font-family:var(--f-mono);font-size:18px;color:var(--accent)}
.tl .ad{font-family:var(--f-display);font-weight:600;font-size:16px;margin-top:2px}
.tl .tag{display:inline-block;margin:6px 0;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:1px 6px}
.read-toggle{margin:14px 0 0 52px}
@media (max-width:640px){.read-toggle{margin-left:0}}

/* Boş sayfa */
.prompt-card{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r);padding:14px 18px;margin-bottom:12px}
.prompt-x{font-family:var(--f-display);font-size:18px;line-height:1.45;margin-top:4px;color:var(--ink)}
.actions{margin-top:12px}
.result{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.res-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.big-score{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1}
.big-score small{font-size:16px;color:var(--ink-2);font-weight:400}
.kp{list-style:none;padding:0}
.kp li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--rule-2);font-size:14.5px}
.kp li:last-child{border-bottom:0}
.kp button{all:unset;display:contents;cursor:pointer}
.mark{font-family:var(--f-mono);font-size:13px;color:var(--ink-3);text-align:center}
.mark.ok{color:var(--good)} .mark.part{color:var(--warn)} .mark.bad{color:var(--bad)}
.meter{height:8px;border-radius:4px;background:var(--rule-2);overflow:hidden;flex:1;min-width:120px}
.meter i{display:block;height:100%;background:var(--accent)}
.hist{margin-top:14px;font-size:13.5px;color:var(--ink-2)}
.hist li{margin-top:2px}
.list-h{font-weight:600;font-size:14px;margin-bottom:4px}
.yan li{margin-top:6px}
.next{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}

/* Kartlar */
.kart-top{margin-bottom:14px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;margin-left:auto}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px 20px;box-shadow:0 3px 0 -1px var(--sheet-2),0 3px 0 0 var(--rule),0 6px 0 -2px var(--sheet-2),0 6px 0 -1px var(--rule);max-width:700px}
.flash-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.flash-q{font-family:var(--f-display);font-size:21px;line-height:1.38;margin-top:14px}
.flash-a{font-family:var(--f-display);font-size:17px;line-height:1.58;margin-top:16px;padding-top:14px;border-top:1px dashed var(--rule)}
.flash-src{margin-top:8px}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.rate button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;border-radius:var(--r-s);border:1px solid var(--rule);background:var(--sheet-2);min-height:54px;font-weight:500;font-size:14px}
.rate button:hover{border-color:var(--ink-3)}
.rate small{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);font-weight:400}
.rate [data-g="1"]{border-color:var(--bad)}
.rate [data-g="4"]{border-color:var(--good)}
@media (max-width:420px){.rate{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kbd{font-family:var(--f-mono);font-size:11.5px}
@media (hover:none){.kbd{display:none}}

/* Ayırt et ve pratik sekmeleri */
.ex-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin}
.ex-tab{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 14px;border-radius:var(--r-s);border:1px solid var(--rule);background:var(--sheet);text-align:left;font-weight:500;font-size:14px}
.ex-tab small{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);font-weight:400}
.ex-tab[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ex-body{margin-top:8px;display:flex;flex-direction:column;gap:12px}
.sort{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.sort-item{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r-s);padding:12px 14px}
.sort-item>p{font-family:var(--f-display);font-size:16.5px;line-height:1.45}
.sort-item.is-ok{border-color:var(--good)}
.sort-item.is-bad{border-color:var(--bad)}
.why{margin-top:8px;font-size:14px;color:var(--ink-2)}
.ex-actions{margin-top:4px}
.chr-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:700px){.chr-wrap{grid-template-columns:1fr}}
.chr-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px;margin-top:8px}
.chr{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:baseline;border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r-s);padding:8px 12px;font-size:14.5px}
.chr.empty{display:block;color:var(--ink-2);border-style:dashed}
.chr.is-ok{border-color:var(--good)} .chr.is-bad{border-color:var(--bad)}
.chr-n,.chr-y{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.pool .choice{border-radius:var(--r-s)}
.dy{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}
.dy-x{font-family:var(--f-display);font-size:17.5px;line-height:1.45;margin-top:4px}
.reasons{margin-top:12px;display:grid;gap:8px}

/* Olay ve pratik */
.olay{border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);overflow:hidden}
.olay-h{padding:10px 16px;border-bottom:1px solid var(--rule);font-family:var(--f-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.olay dl{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px 12px;margin:0;padding:14px 16px}
.olay dt{font-family:var(--f-mono);color:var(--accent);font-size:13px;padding-top:3px}
.olay dd{margin:0;font-family:var(--f-display);font-size:16.5px;line-height:1.5}
.olay .soru,.olay-q{padding:12px 16px;font-weight:600;line-height:1.5}
.olay .soru{border-top:1px dashed var(--rule)}
.olay .soru .eyebrow{display:block;font-weight:400;margin-bottom:2px}
.olay-q{font-family:var(--f-display);font-size:17px;font-weight:400}
.solve{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px;margin:14px 0 12px}
.solve h4{font-size:17px;margin-top:2px}
.solve p.x{font-family:var(--f-display);font-size:16.5px;line-height:1.55;margin-top:6px}
details{margin-top:10px}
summary{cursor:pointer;font-weight:500;color:var(--accent);font-size:14px}
details p{margin-top:6px;font-size:14.5px;color:var(--ink-2)}
.k2-text{font-family:var(--f-display);font-size:17px;line-height:2.1}
.k2-text select{font-size:14.5px;vertical-align:baseline}
.answer{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.timer{font-family:var(--f-mono);font-size:15px;padding:4px 10px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet)}
.timer.over{border-color:var(--bad);color:var(--bad)}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--rule)}
.pre{white-space:pre-wrap;font-family:var(--f-display);font-size:15px}
.rubric td:nth-child(2){font-family:var(--f-mono);white-space:nowrap}
.oz{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px;margin-top:8px}
.oz label{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;font-size:14.5px;cursor:pointer}
.oz input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.oz .p{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}

/* Çıkmışlar */
.cik-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}
.cik-h{display:flex;justify-content:space-between;gap:6px 10px;flex-wrap:wrap;align-items:center}
.cik-q{font-family:var(--f-display);font-size:17px;line-height:1.45;margin-top:6px}
.cik-m{margin-top:10px;font-size:13.5px;color:var(--ink-2)}
.cik-m .btn{margin-left:auto}
.cik.ref{border-style:dashed}
.resmi summary{color:var(--ink)}
.resmi{margin-top:14px}
.resmi .body{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.range{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.range input{flex:1;min-width:160px;accent-color:var(--accent)}
.range output{font-family:var(--f-mono);min-width:64px}

/* Kapı ve gelişim */
.gate-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.gate-status{font-size:16px}
.comps{margin-top:16px;display:flex;flex-direction:column;gap:2px}
.comp{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 78px;gap:12px;align-items:center;padding:6px 0;font-size:14px}
.comp .bar{position:relative;height:10px;border-radius:5px;background:var(--rule-2)}
.comp .bar i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--accent)}
.comp .val{font-family:var(--f-mono);font-size:12.5px;text-align:right}
.comp.total{border-top:1px solid var(--rule);margin-top:6px;padding-top:10px}
.thr{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:1px}
@media (max-width:440px){.comp{grid-template-columns:minmax(0,1fr) 64px}.comp .bar{grid-column:1/-1;order:3}}
.grid2{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);margin-top:18px}
@media (min-width:860px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel{display:flex;flex-direction:column;gap:10px;min-width:0}
.ph{font-size:19px}
.ph2{font-size:16px;margin-top:6px}
.cw{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.cw li{border-top:1px solid var(--rule-2);padding-top:8px;font-size:14.5px}
.logs{list-style:none;padding:0;font-size:14px}
.logs li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px solid var(--rule-2)}
.logs li:last-child{border-bottom:0}
.logs time{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.demo-banner{margin-top:14px;padding:10px 14px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r-s);font-size:14px}
.empty{margin-top:18px}
.confirm{margin-top:12px;padding:12px 14px;border:1px solid var(--bad);background:var(--bad-soft);border-radius:var(--r-s);display:flex;flex-direction:column;gap:10px;font-size:14.5px}

/* ===== v2: çok dersli yapı ve yeni bileşenler ===== */
.tabbar{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
.wide-col{max-width:1040px}
.pbar{display:block;position:relative;height:6px;border-radius:3px;background:var(--rule-2);overflow:hidden}
.pbar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.pbar.thin{height:4px;margin:10px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{font-family:var(--f-ui);font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2);white-space:nowrap}
button.chip{cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ders-g{margin-top:26px}
.ders-gh{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.ders-list{list-style:none;padding:0;margin:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.ders-k{display:flex;flex-direction:column;gap:8px;height:100%;padding:16px 16px 14px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);text-decoration:none;color:var(--ink);transition:border-color .15s}
.ders-k:hover{border-color:var(--accent-line)}
.dk-ad{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.25;text-wrap:balance}
.dk-src{font-size:13px;color:var(--ink-2);line-height:1.45}
.dk-m{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--ink-3);font-family:var(--f-mono);align-items:center;margin-top:auto}
.genel-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));margin:6px 0 16px}
.mini-list{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:6px}
.mini-list li{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;align-items:baseline}
.mini-list li span{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.warn-t{color:var(--warn)!important}
.node.next .node-card{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.node-card .pbar{margin-top:8px}
.harita{margin:6px 0 18px;padding:14px 16px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet)}
.hr-kok{font-family:var(--f-display);font-weight:600;font-size:16px;margin:4px 0 10px}
.hr-dal{list-style:none;margin:0;padding:0;display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.hr-dal button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;border-radius:var(--r-s);border:1px solid var(--rule-2);background:var(--sheet-2)}
.hr-dal button:hover{border-color:var(--accent-line)}
.hr-dal button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hr-dal b{display:block;font-size:14px;font-weight:600}
.hr-dal small{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.35}
.hr-no{font-family:var(--f-mono);font-size:12px;color:var(--accent);padding-top:2px}
.hr-ok{color:var(--good);font-size:13px}
.hr-dal button.read{opacity:.78}
.sec-soru{margin:4px 0 14px 52px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-s) var(--r-s) 0;font-family:var(--f-display);font-size:16.5px;font-style:italic;max-width:62ch}
.sec-soru span{display:block;font-family:var(--f-mono);font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.fig{margin-top:16px;margin-bottom:16px}
.fig figcaption{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.fig-alt{font-size:12.5px;color:var(--ink-3);margin-top:6px;max-width:66ch}
.agac{display:grid;gap:12px}
.ag-kok{justify-self:center;position:relative;padding:7px 16px;border:1.5px solid var(--accent);border-radius:999px;background:var(--accent-soft);font-weight:600;font-size:14.5px;text-align:center}
.ag-kok::after{content:"";position:absolute;left:50%;top:100%;height:12px;border-left:1.5px solid var(--rule)}
.ag-dal{list-style:none;margin:0;padding:14px 0 0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));border-top:1.5px solid var(--rule)}
.ag-dal>li{position:relative;border:1px solid var(--rule);border-radius:var(--r-s);background:var(--sheet);padding:10px 12px}
.ag-dal>li::before{content:"";position:absolute;top:-15px;left:50%;height:14px;border-left:1.5px solid var(--rule)}
.ag-n b{display:block;font-size:14.5px;font-weight:600}
.ag-n span{display:block;font-size:13.5px;color:var(--ink-2);line-height:1.45;margin-top:2px}
.ag-dal ul{list-style:none;margin:8px 0 0;padding:0 0 0 12px;border-left:2px solid var(--accent-line);display:grid;gap:8px}
.ag-dal ul b{font-size:14px}
.akis{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.akis li{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r-s);background:var(--sheet)}
.akis b{display:block;font-size:14.5px}
.akis p{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin-top:2px}
.ak-n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:12px}
.sema{overflow-x:auto}
.sema svg{display:block;width:100%;max-width:470px;height:auto;margin:0 auto;font-family:var(--f-ui)}
.sema .sn{fill:var(--sheet);stroke:var(--ink-3);stroke-width:1.2}
.sema .sn.acc{fill:var(--accent-soft);stroke:var(--accent)}
.sema .sn.mute{fill:var(--sheet-2);stroke:var(--rule)}
.sema .sn-t{fill:var(--ink);font-size:14px;font-weight:600;text-anchor:middle}
.sema .sn-a{fill:var(--ink-2);font-size:11.5px;text-anchor:middle}
.sema .se{fill:none;stroke:var(--ink-3);stroke-width:1.4}
.sema .se.x{stroke:var(--bad);stroke-dasharray:5 4}
.sema .sl{fill:var(--ink-2);font-size:12px;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.sema .sl.x{fill:var(--bad)}
.sema .mk{fill:var(--ink-3)} .sema .mk.x{fill:var(--bad)}
.yokla{margin:12px 0;border:1px dashed var(--accent-line);border-radius:var(--r-s);background:var(--sheet);font-family:var(--f-ui);font-size:14.5px}
.yokla summary{cursor:pointer;padding:10px 14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;list-style:none}
.yokla summary::-webkit-details-marker{display:none}
.yokla summary::after{content:"Cevabı aç";margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--accent)}
.yokla[open] summary::after{content:"Kapat"}
.yk-l{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.yk-q{font-weight:500;flex-basis:100%}
.yk-a{padding:0 14px 12px;color:var(--ink);line-height:1.55;border-top:1px solid var(--rule-2);padding-top:10px}
.tbl-cap{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px}
td.c-ok{color:var(--good)} td.c-no{color:var(--bad)}
.box[data-k="neden"]{background:var(--accent-soft);border-color:var(--accent-line)}
.box[data-k="hata"]{background:var(--bad-soft);border-color:var(--bad)}
.box[data-k="ornek"]{background:var(--good-soft);border-color:var(--good)}
.box[data-k="ipucu"]{background:var(--sheet-2)}
.box[data-k="tanim"]{background:var(--accent-soft);border-color:var(--accent-line)}
.box[data-k="onemli"]{border-color:var(--warn);border-left-width:4px}
.box[data-k="karsilastir"]{border-left-width:4px}
.pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;white-space:pre-wrap;background:var(--sheet-2);border:1px solid var(--rule);border-radius:var(--r-s);padding:10px 12px;overflow-x:auto;margin:10px 0}

/* Paketi etkinleştir: içerik değişkenlerini kurar. */
function setPaket(key, p) {

  p.cikmis = arr(p.cikmis); p.cikmis.forEach(q => { q.max = q.max || q.puan; QMAP[q.id] = q; });

const konuAd = () => PAKET ? (dersOf(DERS) ? dersOf(DERS).ad : '') + ' · Konu ' + PAKET.no : '';
/* Paket hangi adımları içeriyor? Eksik bileşenin adımı gizlenir, ağırlığı diğerlerine dağılır. */
function hasStep(id) {
  if (!PAKET) return false;
  switch (id) {
    case 'ayirt': return EX_IDS.some(e => PAKET.ayirt[e]);
    case 'pratik': return !!(PAKET.pratik.k1 || PAKET.pratik.k2 || PAKET.pratik.k3 || PAKET.pratik.k4);
    case 'cikmis': return PAKET.cikmis.some(q => q.cekirdek);

}
const stepsOn = () => STEPS.filter(s => hasStep(s.id));
const stepAd = id => (id === 'cikmis' && PAKET && PAKET.cikmisAd) || (STEPS.find(s => s.id === id) || {}).ad || id;

/* ================= 3. YARDIMCILAR ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

}
const plainX = s => String(s == null ? '' : s).replace(/\*\*/g, '');
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
const pct = x => Math.round(Math.max(0, Math.min(1, x || 0)) * 100);
const arr = x => Array.isArray(x) ? x : [];
const str = (x, n) => String(x == null ? '' : x).slice(0, n || 400);

function mmss(ms) { const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function ivlText(d) { return d < 30 ? d + ' gün' : Math.round(d / 30) + ' ay'; }
function fmtDate(d, o) { try { return new Intl.DateTimeFormat('tr-TR', o).format(d); } catch (e) { return new Date(d).toDateString(); } }
function relTime(t) {
  const d = Date.now() - t;
  if (d < 60e3) return 'az önce';
  if (d < 3600e3) return Math.floor(d / 60e3) + ' dk önce';
  if (d < DAY) return Math.floor(d / 3600e3) + ' sa önce';
  if (d < 2 * DAY) return 'dün';
  return Math.floor(d / DAY) + ' gün önce';
}
function srcTag(s) {
  const k = String(s).split(' ')[0];
  const kisa = KAYNAK_KISA[k] ? KAYNAK_KISA[k] + String(s).slice(k.length) : s;
  return `<span class="src" title="${esc(KAYNAK[k] || s)}">${esc(kisa)}</span>`;
}
function shuffle(a, seed) {
  let h = 2166136261;
  for (const ch of String(seed)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0;
  for (let i = a.length - 1; i > 0; i--) { h = (Math.imul(h, 1103515245) + 12345) >>> 0; const j = h % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;

/* ================= 4. FSRS (aralıklı tekrar) =================
   FSRS-4.5 formülleri, varsayılan ağırlıklar; hedef hatırlama %90. */
const W = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];
const DECAY = -0.5, FACTOR = 19 / 81;
const clampD = d => Math.min(10, Math.max(1, d));
const D0 = g => clampD(W[4] - (g - 3) * W[5]);
const retr = (days, s) => s > 0 ? Math.pow(1 + FACTOR * days / s, DECAY) : 0;
function fsrsNext(rec, g, now) {
  let s, d, lapses = (rec && rec.lapses) || 0;
  const reps = ((rec && rec.reps) || 0) + 1;
  if (!rec || !rec.s) {
    s = W[g - 1]; d = D0(g); if (g === 1) lapses++;
  } else {
    const R = retr(Math.max(0, (now - rec.last) / DAY), rec.s);
    if (g === 1) {
      s = Math.min(rec.s, W[11] * Math.pow(rec.d, -W[12]) * (Math.pow(rec.s + 1, W[13]) - 1) * Math.exp(W[14] * (1 - R)));
      lapses++;
    } else {
      s = rec.s * (Math.exp(W[8]) * (11 - rec.d) * Math.pow(rec.s, -W[9]) * (Math.exp(W[10] * (1 - R)) - 1) * (g === 2 ? W[15] : 1) * (g === 4 ? W[16] : 1) + 1);
    }
    d = clampD(W[7] * D0(3) + (1 - W[7]) * (rec.d - W[6] * (g - 3)));
  }
  let ivl = Math.max(1, Math.round(s));
  const ex = examTime();
  if (ex) { const left = (ex - now) / DAY; if (left > 1) ivl = Math.min(ivl, Math.max(1, Math.floor(left / 2))); }
  return { s: +s.toFixed(4), d: +d.toFixed(4), last: now, due: now + ivl * DAY, ivl, reps, lapses, lastG: g, t: now };
}
function cardR(rec, at) { if (!rec || !rec.s) return 0; return retr(Math.max(0, (at - rec.last) / DAY), rec.s); }

/* ================= 5. DURUM VE KAYIT ================= */
const MAPS = ['steps', 'read', 'pre', 'cards', 'ex', 'att', 'calib', 'err', 'log'];
function fresh() {
  return { v: 1, epoch: { n: 0, t: 0 }, t: 0, examDate: null, examT: 0, steps: {}, read: {}, pre: {}, cards: {}, ex: {}, att: {}, calib: {}, err: {}, log: {},
    gate: { passed: false, override: false, t: 0 }, last: { step: 'isinma', t: 0 } };
}
function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* tarayıcı depolaması kapalı */ } }
function sane(x) {
  const o = fresh();
  if (!x || typeof x !== 'object') return o;
  for (const k in x) o[k] = x[k];
  for (const k of MAPS) if (!o[k] || typeof o[k] !== 'object' || Array.isArray(o[k])) o[k] = {};
  if (!o.gate || typeof o.gate !== 'object') o.gate = fresh().gate;
  if (!o.epoch || typeof o.epoch !== 'object') o.epoch = { n: 0, t: 0 };

}
const freshUi = () => ({ step: null, ses: null, ex: 'e1', e1: {}, e2: [], e3: {}, e4: {}, exChecked: {}, order: {},
  pr: 'k1', k1: 0, k2: {}, k2c: false, k4: {}, cik: null, cikShow: false, self: {}, bosSelf: {}, bosMode: null, bosIpucu: 0, k3Self: {}, k3Mode: null, k3Model: false,
  photo: {}, photoUrl: {}, preSel: {}, kartSec: 'hepsi', kartYaz: false, kartListe: false, kartAcik: null, yazi: '' });
const S = {
  st: fresh(),
  drafts: {},
  pendingRender: false,
  lastKey: null,
  loading: null,
  hata: null,
  ui: Object.assign(freshUi(), { view: 'bugun', ders: null, mins: 30, ai: {}, timer: null, demo: false, confirm: null, onlyWeak: false })
};
const isRead = (st, id) => !!(st.read[id] && st.read[id].on !== false);

function attOf(st, kind, ref) {
  const out = [];
  for (const id in st.att) { const a = st.att[id]; if (a && a.kind === kind && (ref === undefined || a.ref === ref)) out.push(Object.assign({ id }, a)); }

}

  const groups = {};
  for (const id in st.att) { const a = st.att[id]; const k = a.kind + '|' + a.ref; (groups[k] = groups[k] || []).push([id, a]); }
  for (const k in groups) {

}

/* Birleştirme: iki cihazın ilerlemesi kayıt kayıt birleşir; sıfırlama (epoch) önceliklidir. */
function stable(x) {
  if (Array.isArray(x)) return '[' + x.map(stable).join(',') + ']';
  if (x && typeof x === 'object') return '{' + Object.keys(x).sort().map(k => JSON.stringify(k) + ':' + stable(x[k])).join(',') + '}';
  return JSON.stringify(x);
}
const newer = (a, b) => (((b && b.t) || 0) > ((a && a.t) || 0) ? b : a);
function mergeState(a, b) {

  const o = fresh();
  o.epoch = a.epoch;
  for (const k of MAPS) {
    o[k] = Object.assign({}, a[k]);
    for (const id in b[k]) { const y = b[k][id], x = o[k][id]; if (!x || ((y && y.t) || 0) > ((x && x.t) || 0)) o[k][id] = y; }
  }

  o.gate = Object.assign({}, newer(a.gate, b.gate));
  if (a.gate.passed || b.gate.passed) o.gate.passed = true;
  o.last = newer(a.last, b.last);
  o.t = Math.max(a.t || 0, b.t || 0);

}

/* ================= 6. SENKRON (db): telefon, tablet, bilgisayar =================

/* Mermaid şemaları: kütüphane yalnız gerektiğinde yüklenir; çizilen SVG önbellekte tutulur */
const MMD = { svg: {}, yuk: null, n: 0 };
function mermaidCiz() {
  const els = [...document.querySelectorAll('.mmd[data-mmd]')];
  if (!els.length) return;
  els.forEach(el => { const s = MMD.svg[el.dataset.mmd]; if (s) { el.innerHTML = s; el.classList.add('ok'); } });
  const kalan = els.filter(el => !MMD.svg[el.dataset.mmd]);
  if (!kalan.length) return;
  if (!MMD.yuk) MMD.yuk = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = window.RATIO_PWA ? 'vendor/mermaid.min.js' : 'https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js';
    sc.onload = () => { try { const dark = matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light'; window.mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral', securityLevel: 'strict', fontFamily: 'inherit' }); res(window.mermaid); } catch (e) { rej(e); } };
    sc.onerror = rej; document.head.appendChild(sc);
  });
  MMD.yuk.then(async m => {
    for (const el of kalan) {
      const code = el.dataset.mmd;
      if (MMD.svg[code]) { el.innerHTML = MMD.svg[code]; continue; }
      try { const r = await m.render('mmd' + (++MMD.n), code); MMD.svg[code] = r.svg; } catch (e) { MMD.svg[code] = el.innerHTML; }
      document.querySelectorAll('.mmd[data-mmd]').forEach(x => { if (x.dataset.mmd === code) { x.innerHTML = MMD.svg[code]; x.classList.add('ok'); } });
    }
  }).catch(() => {});
}

  };
  return head('2', 'Oku', 'Her bölüm bir soruyla açılır; şemalar ve tablolar ilişkileri gösterir, bölüm sonundaki “Kendini yokla” soruları okurken hatırlamayı çalıştırır. Kaynaklar başlıkların altında.') +

    <div class="row" style="margin-top:18px">${S.st.steps.oku ? '<span class="pill ok">Oku adımı tamam</span>' : '<button class="btn pri" data-act="oku-done">Okumayı bitir</button>'}<button class="btn" data-act="step" data-step="bos">Boş sayfaya geç</button></div>`;
}

/* ---------- 3. Boş sayfa ---------- */
function listBlock(title, items) {

function bosResult(a) {

  </div>`;
}
function sBos() {
  const b = PAKET.bos, text = S.drafts.bos || '', last = attOf(S.st, 'bos')[0];
  const self = S.ui.bosMode === 'self';
  const selfView = self ? `<div class="card result"><p class="list-h">Yazdığın metinde hangi noktalar var? İşaretle.</p>
    <ul class="kp">${b.kp.map(k => `<li><span class="mark ${S.ui.bosSelf[k.id] ? 'ok' : ''}">${S.ui.bosSelf[k.id] ? '✓' : '○'}</span><button data-act="bos-kp" data-k="${k.id}" aria-pressed="${!!S.ui.bosSelf[k.id]}">${fmt(k.x)}</button></li>`).join('')}</ul>
    <div class="row"><button class="btn pri" data-act="bos-self-save">Kaydet</button><span class="muted small tnum">${b.kp.filter(k => S.ui.bosSelf[k.id]).length}/${b.kp.length} işaretli</span></div></div>` : '';
  const hist = attOf(S.st, 'bos').slice(1, 4);
  return head('3', 'Boş sayfa', 'Kitap kapalı, hatırladığını yaz. Takılırsan ipucu al: önce iskelet, sonra anahtar kelimeler. Sonra notunla karşılaştır; eksik kalan noktalar kart oturumunda öne alınır.') +
    `<div class="prompt-card"><p class="eyebrow">Görev · yaklaşık ${b.dk} dk</p><p class="prompt-x">${fmt(b.prompt)}</p></div>
    <div class="ipucu-wrap">${bosIpucuView(text)}</div>
    <label class="sr" for="t-bos">Cevabın</label>
    <textarea id="t-bos" data-draft="bos" placeholder="Hatırladığın her şeyi yaz. Madde madde yazman yeterli.">${esc(text)}</textarea>
    ${bosMeter(text)}
    <div class="row actions">${aiReady() ? `<button class="btn pri" data-act="bos-ai" data-needs="bos"${text.trim() ? '' : ' disabled'}>Notumla karşılaştır</button>` : ''}<button class="btn" data-act="bos-self" aria-pressed="${self}">Kendim kontrol edeceğim</button></div>
    ${aiNote()}
    ${S.ui.ai.bos ? thinking('bos') : ''}
    ${selfView}
    ${last && !self && !S.ui.ai.bos ? bosResult(last) : ''}
    ${hist.length ? `<ul class="hist"><li class="eyebrow">Önceki denemeler</li>${hist.map(a => `<li class="tnum">%${pct(a.score)}${a.ipucu ? ' · ipuçlu' : ''} · ${esc(relTime(a.t))}</li>`).join('')}</ul>` : ''}`;
}
function bosKws() {
  const seen = new Set(), out = [];
  PAKET.bos.kp.forEach(k => arr(k.kw).forEach(w => { const l = String(w).split('|')[0]; if (!seen.has(l)) { seen.add(l); out.push(w); } }));
  return shuffle(out, AKTIF + 'kw');
}
function bosIpucuView(text) {
  const lv = S.ui.bosIpucu, b = PAKET.bos;
  const seg = `<div class="seg ipucu" role="radiogroup" aria-label="İpucu">${[[0, 'İpucusuz'], [1, 'İskelet'], [2, 'Anahtar kelimeler']].map(([v, l]) => `<button role="radio" aria-checked="${lv === v}" data-act="bos-ipucu" data-v="${v}">${l}</button>`).join('')}</div>`;
  let body = '';
  if (lv >= 1 && b.iskelet) body += `<ol class="iskelet">${b.iskelet.map(x => `<li>${fmt(x)}</li>`).join('')}</ol>`;
  if (lv >= 2) {
    const h = kwHits(bosKws(), text);
    body += `<div class="kw-chips" id="bos-kw">${h.map((x, i) => `<span class="kw${x.hit ? ' hit' : ''}" data-i="${i}">${esc(x.ad)}</span>`).join('')}</div>`;
  }
  return seg + body + (lv ? `<p class="muted small">İpucuyla yapılan denemenin puanı ${lv === 2 ? '%15' : '%5'} düşük sayılır; ipucusuz hatırlama daha kalıcı öğrenme sağlar.</p>` : '');
}
function bosMeter(text) {

  return `<div class="bos-olcer" id="bos-meter" aria-live="polite"><span class="tnum"><b>${n}</b>/${kp.length}</span><span class="pbar"><i style="width:${Math.round(n / kp.length * 100)}%"></i></span><span class="muted small">anahtar noktaya değindin · anahtar kelimelere göre tahmin</span></div>`;
}
function bosCanli(text) {
  const m = document.getElementById('bos-meter');
  if (m) m.outerHTML = bosMeter(text);
  const box = document.getElementById('bos-kw');
  if (box) { const h = kwHits(bosKws(), text); box.querySelectorAll('.kw').forEach(el => { const x = h[+el.dataset.i]; el.classList.toggle('hit', !!(x && x.hit)); }); }

/* ---------- 4. Kartlar ---------- */
function boslukHtml(q, show) {
  return String(q).split(/\[\[(.+?)\]\]/).map((part, i) => i % 2
    ? (show ? `<mark class="gap ok">${esc(part)}</mark>` : `<span class="gap" aria-label="boşluk">${'＿'.repeat(Math.min(9, Math.max(4, Math.round(part.length / 2))))}</span>`)
    : fmt(part)).join('');
}
const kartOn = c => c.tip === 'bosluk' ? boslukHtml(c.q, false) : fmt(c.q);
function kartArka(c) {
  if (c.tip === 'bosluk') return `<p>${boslukHtml(c.q, true)}</p>`;
  if (c.tip === 'liste') return `<ol class="kart-liste">${c.items.map(i => `<li>${fmt(i)}</li>`).join('')}</ol>`;
  if (c.tip === 'karsilastir') return `<div class="tbl-wrap"><table class="mini"><thead><tr>${c.kol.map(h => `<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${c.satir.map(r => `<tr>${r.map(cellView).join('')}</tr>`).join('')}</tbody></table></div>`;
  return `<p>${fmt(c.a)}</p>${c.ek && c.ek.length ? `<dl class="kart-ek">${c.ek.map(e => `<dt>${esc(e[0])}</dt><dd>${fmt(e[1])}</dd>`).join('')}</dl>` : ''}`;
}
function kartDurum(c) {

}
function flashView(ses) {
  const c = CARD[ses.cur], rec = S.st.cards[c.id], first = !ses.res[c.id], now = Date.now();
  const prev = first ? [1, 2, 3, 4].map(g => fsrsNext(rec, g, now).ivl) : null;
  const lab = ['Bilemedim', 'Zorlandım', 'Bildim', 'Kolay'];
  const sub = g => prev ? ivlText(prev[g - 1]) : (g >= 3 ? 'oturumda doğru' : 'tekrar gelir');
  const yazi = S.drafts.kart || '';
  let sug = 0, hits = null;
  if (ses.rev && S.ui.kartYaz && yazi.trim()) {
    hits = kwHits(c.kw, yazi);
    const r = hits.filter(h => h.hit).length / (hits.length || 1);
    sug = r >= 0.8 ? 3 : r >= 0.5 ? 2 : 1;
  }
  const done = ses.done.length, tot = ses.total;
  return `<div class="flash" aria-live="polite">
    <div class="flash-meta"><span>Kart ${c.n} · ${esc(c.sec)} ${esc(SEC_AD[c.sec] || '')} · ${esc(TIP_AD[c.tip] || '')}</span><span class="tnum">${done}/${tot} tamam</span></div>
    <span class="pbar thin" aria-hidden="true"><i style="width:${tot ? Math.round(done / tot * 100) : 0}%"></i></span>
    <div class="flash-q">${kartOn(c)}</div>
    ${S.ui.kartYaz && !ses.rev ? `<label class="sr" for="t-kart">Cevabın</label><textarea id="t-kart" class="kart-yazi" data-draft="kart" placeholder="Önce kendin yaz, sonra cevabı aç.">${esc(yazi)}</textarea>` : ''}
    ${ses.rev ? `<div class="flash-a">${kartArka(c)}<div class="flash-src">${srcTag(c.src)}</div></div>
      ${hits ? `<div class="kw-sonuc"><p class="eyebrow">Cevabındaki anahtar kelimeler</p><div class="kw-chips">${hits.map(h => `<span class="kw ${h.hit ? 'hit' : 'miss'}">${h.hit ? '✓' : '✗'} ${esc(h.ad)}</span>`).join('')}</div><p class="muted small yazi-ozet">Senin cevabın: “${esc(yazi.slice(0, 300))}${yazi.length > 300 ? '…' : ''}”</p></div>` : ''}
      <div class="rate" role="group" aria-label="Ne kadar hatırladın?">${[1, 2, 3, 4].map(g => `<button data-act="rate" data-g="${g}"${sug === g ? ' class="sug"' : ''}><span>${lab[g - 1]}</span><small>${sub(g)}</small></button>`).join('')}</div>
      ${sug ? `<p class="muted small">Anahtar kelimelere göre öneri: <strong>${lab[sug - 1]}</strong>. Karar senin.</p>` : ''}`
      : `<div class="row" style="margin-top:16px"><button class="btn pri" data-act="reveal">Cevabı göster</button><span class="muted kbd">Boşluk tuşu · sonra 1–4</span></div>`}
  </div>
  <div class="row" style="margin-top:14px"><button class="btn quiet" data-act="ses-end">Oturumu bitir</button>${ses.hist && ses.hist.length ? '<button class="btn quiet" data-act="kart-geri">↶ Son puanı geri al</button>' : ''}</div>`;
}
function kartListe(list) {
  const now = Date.now();
  return `<ul class="kart-list">${list.map(c => {
    const [d, k] = kartDurum(c), r = S.st.cards[c.id], open = S.ui.kartAcik === c.id;
    const due = r ? (r.due <= now ? 'tekrar zamanı' : ivlText(Math.max(1, Math.ceil((r.due - now) / DAY))) + ' sonra') : '';
    return `<li class="${open ? 'open' : ''}"><button class="kl-b" data-act="kart-ac" data-id="${c.id}" aria-expanded="${open}"><span class="kl-n tnum">${c.n}</span><span class="kl-q">${kartOn(c)}</span><span class="kl-s"><span class="pill ${k}">${d}</span>${due ? `<small class="tnum">${due}</small>` : ''}</span></button>${open ? `<div class="kl-a">${kartArka(c)}<div class="flash-src">${srcTag(c.src)}</div></div>` : ''}</li>`;
  }).join('')}</ul>`;
}
function sKartlar() {
  const now = Date.now(), all = PAKET.kartlar, ses = S.ui.ses;
  const secs = [...new Set(all.map(c => c.sec))];
  const fil = all.filter(c => S.ui.kartSec === 'hepsi' || c.sec === S.ui.kartSec);
  const nNew = fil.filter(c => !S.st.cards[c.id]).length;
  const nDue = fil.filter(c => S.st.cards[c.id] && S.st.cards[c.id].due <= now).length;
  const nWeak = fil.filter(c => S.st.cards[c.id] && (S.st.cards[c.id].lastG || 0) <= 2).length;
  let body;

      : `<div class="card"><p>${S.ui.onlyWeak ? 'Bilmediğin olarak işaretli kart yok.' : 'Şu an vadesi gelen kart yok.'} ${esc(nextDueText())}</p><div class="row" style="margin-top:12px"><button class="btn" data-act="ses-start" data-early="1">Yine de tekrar et</button></div></div>`;

    `<div class="row kart-top"><span class="pill tnum">${nNew} yeni</span><span class="pill tnum">${nDue} vadesi gelen</span><span class="pill tnum">${nWeak} zayıf</span><span class="muted small">${esc(nextDueText())}</span></div>${filters}${body}`;
}

/* ---------- 5. Ayırt et ---------- */
function orderOf(e) { if (!S.ui.order[e.id]) S.ui.order[e.id] = shuffle(e.items.slice(), e.id + Date.now()); return S.ui.order[e.id]; }
function exSort(e, map) {
  const checked = !!S.ui.exChecked[e.id], items = orderOf(e);
  const placed = items.filter(it => map[it.id] != null).length;
  const c = items.filter(it => map[it.id] === it.a).length;
  return `<ol class="sort">${items.map(it => {
    const v = map[it.id], ok = v === it.a;
    const btns = e.kovalar.map((k, j) => {
      let cls = '';
      if (checked) { if (j === it.a) cls = ' ok'; else if (j === v) cls = ' bad'; }
      return `<button class="choice${cls}" data-act="sort-pick" data-e="${e.id}" data-it="${it.id}" data-j="${j}" aria-pressed="${v === j}"${checked ? ' disabled' : ''}>${esc(k)}</button>`;
    }).join('');
    return `<li class="sort-item${checked ? (ok ? ' is-ok' : ' is-bad') : ''}"><p>${fmt(it.x)}</p><div class="choices" role="group">${btns}</div>${checked && !ok ? `<p class="why">${fmt(it.why)}</p>` : ''}</li>`;
  }).join('')}</ol>
  <div class="row ex-actions">${checked
    ? `<span class="pill ${c === items.length ? 'ok' : 'warn'} tnum">${c}/${items.length} doğru</span><button class="btn" data-act="ex-reset" data-e="${e.id}">Karıştırıp tekrar dene</button>`
    : `<button class="btn pri" data-act="ex-check" data-e="${e.id}"${placed === items.length ? '' : ' disabled'}>Kontrol et</button><span class="muted small tnum">${placed}/${items.length} yerleştirildi</span>`}</div>`;
}
function exChrono(e) {
  const checked = !!S.ui.exChecked.e2, order = S.ui.e2;
  const correct = e.items.slice().sort((a, b) => a.y - b.y);
  const byId = id => e.items.find(x => x.id === id);
  const pool = orderOf(e).filter(it => !order.includes(it.id));
  const chosen = order.map((id, i) => { const it = byId(id), ok = checked && correct[i].id === id; return `<li class="chr${checked ? (ok ? ' is-ok' : ' is-bad') : ''}"><span class="chr-n tnum">${i + 1}</span><span>${fmt(it.ad)}</span>${checked ? `<span class="chr-y tnum">${it.y}</span>` : '<span></span>'}</li>`; }).join('');
  const c = checked ? order.filter((id, i) => correct[i].id === id).length : 0;
  return `<div class="chr-wrap">
    <div><p class="eyebrow">Sıralaman</p><ol class="chr-list">${chosen || '<li class="chr empty">Belgeler listesinden en eskisine dokun.</li>'}</ol></div>
    ${checked
      ? `<div><p class="eyebrow">Doğru sıra</p><ol class="chr-list">${correct.map((it, i) => `<li class="chr"><span class="chr-n tnum">${i + 1}</span><span><strong>${esc(it.isim)}</strong><br><span class="muted small">${fmt(it.ad)}</span></span><span class="chr-y tnum">${it.y}</span></li>`).join('')}</ol></div>`
      : `<div><p class="eyebrow">Belgeler</p><div class="choices pool">${pool.map(it => `<button class="choice" data-act="chr-add" data-it="${it.id}">${fmt(it.ad)}</button>`).join('') || '<span class="muted small">Hepsi sıralandı.</span>'}</div></div>`}
  </div>
  <div class="row ex-actions">${checked
    ? `<span class="pill ${c === correct.length ? 'ok' : 'warn'} tnum">${c}/${correct.length} doğru yerde</span><button class="btn" data-act="ex-reset" data-e="e2">Tekrar dene</button>`
    : `<button class="btn" data-act="chr-undo"${order.length ? '' : ' disabled'}>Geri al</button><button class="btn pri" data-act="ex-check" data-e="e2"${order.length === e.items.length ? '' : ' disabled'}>Kontrol et</button>`}</div>`;
}
function exDY(e) {
  const items = orderOf(e), st = S.ui.e4;

  return `<ol class="dy">${items.map((it, i) => {
    const s = st[it.id] || {}, locked = s.r != null;
    let inner = `<div class="choices"><button class="choice" data-act="dy-v" data-it="${it.id}" data-v="1" aria-pressed="${s.v === true}"${locked ? ' disabled' : ''}>Doğru</button><button class="choice" data-act="dy-v" data-it="${it.id}" data-v="0" aria-pressed="${s.v === false}"${locked ? ' disabled' : ''}>Yanlış</button></div>`;
    if (s.v != null && !locked) {
      inner += s.c
        ? `<div class="reasons"><p class="eyebrow">Gerekçen hangisi?</p>${it.why.map((w, j) => `<button class="opt" data-act="dy-r" data-it="${it.id}" data-r="${j}"><span class="l">${'ABC'[j]}</span><span>${fmt(w)}</span></button>`).join('')}</div>`
        : `<div class="conf"><span class="eyebrow">Ne kadar eminsin?</span><div class="choices">${CONF_AD.map((c, k) => `<button class="choice" data-act="dy-c" data-it="${it.id}" data-c="${k + 1}">${c}</button>`).join('')}</div></div>`;
    }
    if (locked) {

      inner += `<div class="fb"><span class="pill ${vOk && rOk ? 'ok' : vOk ? 'warn' : 'bad'}">${vOk && rOk ? 'Tam puan' : vOk ? 'Yarım puan: gerekçe yanlış' : 'Yanlış'}</span>İfade <strong>${it.d ? 'doğru' : 'yanlış'}</strong>. ${fmt(it.why[it.w])}</div>`;
    }
    return `<li class="card"><p class="eyebrow">İfade ${i + 1}</p><p class="dy-x">${fmt(it.x)}</p>${inner}</li>`;
  }).join('')}</ol>
  ${all ? `<div class="row ex-actions"><span class="pill tnum">Puan %${pct(avg(items.map(it => st[it.id].score)))}</span><button class="btn" data-act="ex-reset" data-e="e4">Karıştırıp tekrar dene</button></div>` : ''}`;
}
function sAyirt() {
  const ids = exIds(), cur = ids.includes(S.ui.ex) ? S.ui.ex : ids[0], e = PAKET.ayirt[cur];
  const tabs = ids.map(id => { const x = PAKET.ayirt[id], r = S.st.ex[id]; return `<button class="ex-tab" data-act="ex" data-e="${id}"${id === cur ? ' aria-current="true"' : ''}><span>${esc(x.ad)}</span><small class="tnum">${r ? 'en iyi %' + pct(r.best) : 'yeni'}</small></button>`; }).join('');
  const body = (e.tur || (cur === 'e2' ? 'sira' : cur === 'e4' ? 'dy' : 'kova')) === 'sira' ? exChrono(e) : (e.tur || (cur === 'e4' ? 'dy' : 'kova')) === 'dy' ? exDY(e) : exSort(e, cur === 'e3' ? S.ui.e3 : S.ui.e1);
  return head('5', 'Ayırt et', 'Benzer kurumları birbirinden ayırma alıştırmaları. Maddeler karışık sırayla gelir; yanlışların türüne göre hata defterine düşer.') +
    `<div class="ex-tabs">${tabs}</div><div class="ex-body"><p class="muted">${fmt(e.aciklama)} ${srcTag(e.src)}</p>${body}</div>`;
}

/* ---------- 6. Pratik ---------- */
function olayView(o, etiket, soru) {
  return `<div class="olay"><div class="olay-h"><span>${esc(o.devlet)}</span>${etiket ? `<span>${esc(etiket)}</span>` : ''}</div>
    <dl>${o.maddeler.map(m => `<dt>${esc(m[0])}</dt><dd>${fmt(m[1])}</dd>`).join('')}</dl>
    <p class="soru"><span class="eyebrow">Soru</span>${fmt(soru)}</p></div>`;
}
function k1View() {
  const k = PAKET.pratik.k1, n = Math.min(S.ui.k1, k.adimlar.length - 1);
  return olayView(k.olay, k.etiket, k.soru) +
    `<ol class="solve">${k.adimlar.slice(0, n + 1).map((a, i) => `<li class="card"><p class="eyebrow">Adım ${i + 1} / ${k.adimlar.length}</p><h4>${esc(a.h)}</h4><p class="x">${fmt(a.x)}</p><details><summary>Neden?</summary><p>${fmt(a.neden)}</p></details></li>`).join('')}</ol>
    <div class="row">${n < k.adimlar.length - 1 ? '<button class="btn pri" data-act="k1-next">Sonraki adım</button>' : (S.st.steps.k1 ? '<span class="pill ok">Çözümlü örnek tamam</span><button class="btn" data-act="pr" data-k="k2">Kademe 2’ye geç</button>' : '<button class="btn pri" data-act="k1-done">Anladım, kademe 2’ye geç</button>')}</div>
    ${n === k.adimlar.length - 1 ? `<div class="fb"><span class="pill">Resmî yanıt</span>${fmt(k.resmi)} ${srcTag('FAS 4.2')}</div>` : ''}`;
}
function k2View() {
  const k = PAKET.pratik.k2, sel = S.ui.k2, checked = S.ui.k2c;
  const blanks = k.parcalar.filter(p => typeof p !== 'string');

    : `<select id="k2-${p.b}" data-chg="k2" data-b="${p.b}" class="${checked ? (sel[p.b] === p.a ? 'ok' : 'bad') : ''}"${checked ? ' disabled' : ''} aria-label="Boşluk ${p.b.slice(1)}"><option value="">seç</option>${p.o.map((o, i) => `<option value="${i}"${sel[p.b] === i ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`).join('');
  return olayView(k.olay, 'Yeni olay · boşluklu çözüm', k.soru) +
    `<div class="card" style="margin-top:12px"><p class="eyebrow">Çözümü tamamla</p><p class="k2-text">${text}</p></div>
    ${checked ? `<ul class="yan">${blanks.filter(b => sel[b.b] !== b.a).map(b => `<li><span class="pill bad">${esc(b.o[b.a])}</span> ${fmt(k.aciklama[b.b])}</li>`).join('')}</ul>` : ''}
    <div class="row actions">${checked
      ? `<span class="pill ${c === blanks.length ? 'ok' : 'warn'} tnum">${c}/${blanks.length} doğru</span><button class="btn" data-act="k2-reset">Tekrar dene</button><button class="btn pri" data-act="pr" data-k="k3">Kademe 3’e geç</button>`
      : `<button class="btn pri" data-act="k2-check"${filled === blanks.length ? '' : ' disabled'}>Kontrol et</button><span class="muted small tnum">${filled}/${blanks.length} boşluk dolu</span>`}</div>`;
}
function photoField(k) {
  const f = S.ui.photo[k], u = S.ui.photoUrl[k];
  if (f) return `<div class="photo row">${u ? `<img src="${u}" alt="Eklenen cevap fotoğrafı">` : ''}<span class="small">${esc(f.name)}</span><button class="btn sm quiet" data-act="photo-rm" data-k="${k}">Kaldır</button></div>`;
  const acc = (IMG && IMG.mediaTypes && IMG.mediaTypes.length ? IMG.mediaTypes : ['image/jpeg', 'image/png']).join(',');
  return `<div class="row"><label class="btn sm"><input class="vh" type="file" accept="${esc(acc)}" data-chg="photo" data-k="${k}">El yazını fotoğrafla ekle</label><span class="muted small">Tablette kalemle çözüp fotoğrafını ekleyebilirsin.</span></div>`;
}
function answerBox(key, o) {
  const text = S.drafts[key] || '', photo = S.ui.photo[key];
  const t = S.ui.timer && S.ui.timer.key === key ? S.ui.timer : null;
  const qa = o.q ? ` data-q="${o.q}"` : '';
  return `<div class="answer">
    <div class="row">${t ? `<span class="timer tnum" data-timer>${mmss(Math.max(0, t.end - Date.now()))}</span><button class="btn sm quiet" data-act="timer-stop">Süreyi durdur</button>` : `<button class="btn sm" data-act="timer" data-k="${key}" data-m="${o.dk}">Süreyi başlat · ${o.dk} dk</button>`}</div>
    <label class="sr" for="t-${key}">Cevabın</label>

    ${IMG && aiReady() ? photoField(key) : ''}
    <div class="row">${aiReady() ? `<button class="btn pri" data-act="${o.aiAct}"${qa} data-needs="${key}"${text.trim() || photo ? '' : ' disabled'}>Yapay zekâyla değerlendir</button>` : ''}<button class="btn" data-act="${o.selfAct}"${qa}>${esc(o.selfLabel)}</button></div>
    ${aiNote()}
    ${S.ui.ai[key] ? thinking(key) : ''}

}
function resultCard(a, max, extraTop) {

    <div class="res-top"><span class="big-score tnum">${a.pts}<small>/${max}</small></span><div><p class="eyebrow">${a.mode === 'ai' ? 'Yapay zekâ değerlendirmesi' : 'Öz değerlendirme'} · ${esc(relTime(a.t))}</p>${d.gy ? `<p>${fmt(d.gy)}</p>` : ''}${d.gb ? `<p>${fmt(d.gb)}</p>` : ''}</div></div>

    ${d.sa ? `<p class="next"><span class="pill accent">Sıradaki adım</span>${fmt(d.sa)}</p>` : ''}
    ${d.okunan ? `<details><summary>Fotoğraftan okunan metin</summary><p class="pre">${esc(d.okunan)}</p></details>` : ''}

}
function k3View() {
  const k = PAKET.pratik.k3, last = attOf(S.st, 'k3')[0];
  const selfView = S.ui.k3Mode === 'self' ? `<div class="card"><p class="list-h">Cevabında bunlar var mı? (her biri 2 puan)</p><ul class="oz">${k.oz.map(r => `<li><label><input type="checkbox" data-chg="k3oz" data-r="${r.id}"${S.ui.k3Self[r.id] ? ' checked' : ''}><span>${fmt(r.x)}</span><span class="p">${r.p} p</span></label></li>`).join('')}</ul><div class="row" style="margin-top:10px"><button class="btn pri" data-act="k3-self-save">Kaydet</button><span class="muted small tnum">${k.oz.filter(r => S.ui.k3Self[r.id]).reduce((s, r) => s + r.p, 0)}/20</span></div></div>` : '';
  const rub = last ? `<div class="tbl-wrap"><table class="rubric"><thead><tr><th scope="col">Boyut</th><th scope="col">Puan</th><th scope="col">Ölçüt</th></tr></thead><tbody>${k.rubrik.map(r => `<tr><td><strong>${esc(r.ad)}</strong></td><td class="tnum">${last.detail && last.detail.sc && last.detail.sc[r.k] != null ? last.detail.sc[r.k] : '–'}/4</td><td>${fmt(r.x)}</td></tr>`).join('')}</tbody></table></div>` : '';

    `<div class="row" style="margin-top:12px"><button class="btn quiet" data-act="k3-model">${S.ui.k3Model ? 'Model çözümü gizle' : 'Model çözümü göster'}</button></div>
    ${S.ui.k3Model ? `<div class="card flat" style="margin-top:6px"><p class="eyebrow">Model çözüm</p><div class="prose" style="margin-top:8px">${k.model.map(p => `<p>${fmt(p)}</p>`).join('')}</div><p class="small muted" style="margin-top:10px">Fasikülün 1924 Anayasası resmî yanıtı (Bölüm 4.1) ve notunun Konu 12 bölümüyle kuruldu.</p></div>` : ''}`;
}
function sPratik() {
  const P = PAKET.pratik, avail = ['k1', 'k2', 'k3', 'k4'].filter(x => P[x]);
  const k = avail.includes(S.ui.pr) ? S.ui.pr : avail[0];

  const tabs = avail.map(x => [x, AD[x], yap(x)]);
  return head('6', 'Pratik', 'Olay laboratuvarı kademeli: çözümlü örnek, boşluklu çözüm, kendi çözümün ve son olarak tek değişkenli varyasyonlar. Kademe 1 gerçek bir çıkmış uygulamalı sorudur.') +
    `<div class="ex-tabs">${tabs.map((t, i) => `<button class="ex-tab" data-act="pr" data-k="${t[0]}"${t[0] === k ? ' aria-current="true"' : ''}><span>Kademe ${i + 1} · ${t[1]}</span><small>${t[2] ? 'yapıldı' : 'yapılmadı'}</small></button>`).join('')}</div>

}

/* ---------- 7. Çıkmışlar ---------- */

  return `<div class="stack"><div><button class="btn quiet" data-act="cik-close">← Çıkmış listesi</button></div>
    <div class="olay"><div class="olay-h"><span>${esc(q.etiket)}</span><span>${q.puan ? q.puan + ' puan' : 'Puan belirtilmemiş · 20 üzerinden'}</span></div>${q.olay ? `<div class="olay-t">${(Array.isArray(q.olay) ? q.olay : [q.olay]).map(p => `<p>${fmt(p)}</p>`).join('')}</div>` : ''}<p class="olay-q">${fmt(q.soru)}</p></div>
    ${answerBox(key, { aiAct: 'cik-ai', q: q.id, selfAct: 'cik-show', selfLabel: q.goster || 'Resmî yanıtı göster', dk: q.dk })}
    ${last && last.detail ? resultCard(last, q.max) : ''}
    ${show ? `<details class="card resmi" open><summary><strong>${esc(q.yanitAd || 'Resmî yanıt')}</strong> ${srcTag(q.kaynak || ('FAS ' + q.fas))}</summary><div class="body flat">${q.yanit.map(blockView).join('')}</div></details>
      <div class="card"><label class="list-h" for="r-${q.id}">Resmî yanıta göre kendine puan ver</label><div class="range"><input type="range" id="r-${q.id}" min="0" max="${q.max}" step="1" value="${v}" data-inp="self" data-q="${q.id}"><output class="tnum" id="o-${q.id}">${v}/${q.max}</output><button class="btn sm" data-act="cik-self-save" data-q="${q.id}">Kaydet</button></div></div>` : ''}
  </div>`;

    `<ul class="cik-list">${PAKET.cikmis.map(q => {
      const n = attOf(S.st, 'cik', q.id).length, b = bestOf(S.st, 'cik', q.id);
      return `<li class="card"><div class="cik-h"><span class="eyebrow">${esc(q.etiket)}</span>${q.cekirdek ? '' : '<span class="pill">' + esc(q.pill || 'Komşu konuyla ortak') + '</span>'}</div><p class="cik-q">${q.olay && q.kisa ? '<span class="cik-k">' + esc(q.kisa) + '</span> ' : ''}${fmt(q.soru.length > 400 ? q.soru.slice(0, 400) + '…' : q.soru)}</p>
        <div class="row cik-m"><span class="tnum">${q.puan ? q.puan + ' puan' : 'Puan belirtilmemiş'}</span><span class="tnum">≈ ${q.dk} dk</span>${n ? `<span class="pill ${b >= .8 ? 'ok' : b >= .5 ? 'warn' : 'bad'} tnum">En iyi %${pct(b)}</span>` : ''}<button class="btn sm pri" data-act="cik-open" data-q="${q.id}">${n ? 'Tekrar çöz' : 'Çöz'}</button></div></li>`;

    ${k1 && k1.etiket && !PAKET.cikmis.some(q => k1.etiket.indexOf(q.etiket) === 0) ? `<li class="card cik ref"><div class="cik-h"><span class="eyebrow">${esc(k1.etiket)}</span></div><p class="cik-q">${fmt(k1.soru)}</p><div class="row cik-m"><span>Pratik adımında çözümlü örnek olarak işleniyor.</span><button class="btn sm" data-act="goto" data-step="pratik" data-pr="k1">Pratik’e git</button></div></li>` : ''}</ul>`;

/* ---------- Kapı ---------- */
function compRows(m) {
  const W2 = wOn();
  return Object.keys(W2).map(k => `<div class="comp"><span>${esc(COMP_AD[k])} <span class="muted small">· %${Math.round(W2[k] * 100)}</span></span><span class="bar"><i style="width:${pct(m[k])}%"></i></span><span class="val tnum">%${pct(m[k])}</span></div>`).join('') +
    `<div class="comp total"><span><strong>Ustalık</strong></span><span class="bar"><i style="width:${pct(m.total)}%"></i><b class="thr" style="left:80%" title="Kapı %80"></b></span><span class="val tnum"><strong>%${pct(m.total)}</strong></span></div>`;
}
function sKapi() {
  const m = mastery(S.st), passed = S.st.gate.passed, w = weakest(S.st);
  const need = Math.max(0, Math.ceil((GATE - m.total) * 100));
  const conf = S.ui.confirm === 'gate'
    ? `<div class="confirm"><p>Kapıyı elle geçersen sıradaki konu önerilir ama bu konunun ustalığı %${pct(m.total)} olarak kalır ve tekrarları sürer.</p><div class="row"><button class="btn pri" data-act="gate-yes">Evet, ${esc(sonrakiAd())} sıraya alınsın</button><button class="btn" data-act="confirm-no">Vazgeç</button></div></div>`
    : `<div class="row"><button class="btn quiet" data-act="gate-ask">Kapıyı elle geç</button></div>`;
  return head('K', 'Kapı', 'Konunun ustalığı %80’i geçince kapı açılır ve konu yolunda sıradaki konu önerilir. Ustalık, paketteki bileşenlerin ağırlıklı ortalamasıdır.') +
    `<div class="card"><div class="gate-top"><div class="ring big" style="--p:${pct(m.total)}"><b class="tnum">%${pct(m.total)}</b></div><div class="stack" style="gap:8px">
      <p class="gate-status">${passed ? '<span class="pill ok">Kapı açık</span> Sırada ' + esc(sonrakiAd()) + ' var.' : `<span class="pill">Kapı kapalı</span> <span class="tnum">%80 için ${need} puan daha.</span>`}</p>
      ${!passed && w ? `<p class="muted">En çok puanı <strong>${esc(COMP_AD[w.k])}</strong> getirir (şu an %${pct(w.v)}).</p><div><button class="btn pri sm" data-act="step" data-step="${w.step}">${esc(stepAd(w.step))} adımına git</button></div>` : ''}
    </div></div>
    <div class="comps">${compRows(m)}</div>
    <p class="muted small" style="margin-top:10px">Hatırlama: kartların ${examTime() ? 'sınav günü' : '7 gün sonra'} için tahmini hatırlanma olasılığı. Olay çözümü: boşluklu çözüm %30, kendi çözümün %70. Çıkmışlar: ustalığa sayılan 4 sorunun en iyi puanları.</p>
    ${passed ? '' : conf}</div>`;
}

/* ---------- Gelişim ---------- */
function panelUstalik(st) {
  const m = mastery(st), w = weakest(st);
  return `<article class="card panel"><h2 class="ph">Ustalık · Konu ${esc(PAKET.no)}</h2><div class="comps">${compRows(m)}</div>
    ${w ? `<p class="small">En çok puan getirecek alan: <strong>${esc(COMP_AD[w.k])}</strong>. ${S.ui.demo ? '' : `<button class="btn sm" data-act="goto" data-step="${w.step}">${esc(stepAd(w.step))}</button>`}</p>` : '<p class="small">Bütün bileşenler tam.</p>'}</article>`;
}
function panelHatirlama(st) {
  const h = horizon(st), rs = PAKET.kartlar.map(c => st.cards[c.id] ? cardR(st.cards[c.id], h) : -1);
  const b = [['%90 ve üstü', r => r >= .9], ['%70–90', r => r >= .7 && r < .9], ['%50–70', r => r >= .5 && r < .7], ['%50 altı', r => r >= 0 && r < .5], ['Hiç çalışılmadı', r => r < 0]];
  const max = Math.max(1, ...b.map(x => rs.filter(x[1]).length));
  return `<article class="card panel"><h2 class="ph">Sınav günü hatırlama</h2><p class="muted small">${examTime(st) ? 'Sınav günü' : '7 gün sonra'} kartların hatırlanma olasılığı (FSRS tahmini). Ortalama <strong class="tnum">%${pct(examRecall(st))}</strong>.</p>
    <div>${b.map(x => { const n = rs.filter(x[1]).length; return `<div class="comp"><span>${esc(x[0])}</span><span class="bar"><i style="width:${Math.round(n / max * 100)}%"></i></span><span class="val tnum">${n} kart</span></div>`; }).join('')}</div></article>`;
}
function panelKalibrasyon(st) {
  const all = Object.values(st.calib);
  const rows = [1, 2, 3, 4].map(c => { const xs = all.filter(x => x.conf === c); return { c, n: xs.length, acc: xs.length ? xs.filter(x => x.ok).length / xs.length : null }; });
  const hi = all.filter(x => x.conf >= 3), hiAcc = hi.length ? hi.filter(x => x.ok).length / hi.length : null;
  const cw = confidentWrong(st);
  return `<article class="card panel"><h2 class="ph">Kalibrasyon</h2><p class="muted small">Cevaptan önce söylediğin eminlik ile gerçek doğruluk oranın. Isınma ve gerekçeli doğru/yanlış sorularından gelir.</p>
